<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>しあTube</title>
    <meta
      name="description"
      content="しあTubeは、日本向けのYouTube匿名視聴サービスです。アカウント不要・広告なしで、プライバシーを守りながら音楽や動画を快適に再生できます。"
    />
    <meta
      name="keywords"
      content="しあTube, YouTube 匿名視聴, プライバシー保護, Invidious 日本, 広告なし, 動画再生"
    />

    <meta property="og:title" content="しあTube｜YouTube匿名視聴サイト" />
    <meta
      property="og:description"
      content="YouTube動画を匿名で、広告なし・追跡なしで視聴。日本向け特化で音楽も再生可能。"
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://siatube-web.com/" />
    <meta property="og:locale" content="ja_JP" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="しあTube｜YouTube匿名視聴サイト" />
    <meta
      name="twitter:description"
      content="YouTube動画を安全・匿名で視聴。広告なし・ログなしで快適に再生できます。"
    />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.txt" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon/favicon-48x48.txt" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon/favicon-64x64.txt" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon/android-chrome-192x192.txt" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon/android-chrome-512x512.txt" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.txt" />
    <link rel="manifest" href="/favicon/site.webmanifest" />

    <style>
      a {
        color: var(--link-color);
      }

      body {
        font-family: "ヒラギノ角ゴ ProN", "Hiragino Kaku Gothic ProN",
                     "メイリオ", Meiryo,
                     "ＭＳ ゴシック", "MS Gothic",
                     sans-serif;
        background-color: var(--bg-primary);
        color: var(--text-primary);
        margin: 0;
        line-height: 1.8;
        transition: background-color 0.3s ease, color 0.3s ease;
      }

      .desktop-only-notice {
        display: none;
        box-sizing: border-box;
        min-height: 100vh;
        min-height: 100svh;
        padding: 32px 24px;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        background: var(--bg-primary, #fff);
        color: var(--text-primary, #212121);
        text-align: center;
      }

      .desktop-only-notice svg {
        width: 64px;
        height: 64px;
        flex-shrink: 0;
        opacity: 0.7;
      }

      .desktop-only-notice h1 {
        max-width: 30rem;
        margin: 0;
        font-size: 1.25rem;
        font-weight: 600;
        line-height: 1.8;
      }

      html.dark-mode .desktop-only-notice {
        background: var(--bg-primary, #1a1a1a);
        color: var(--text-primary, #e0e0e0);
      }

      /* Match the JavaScript desktop query, including fractional viewport widths. */
      @media not all and (min-width: 1000px) {
        #app, noscript {
          display: none !important;
        }

        .desktop-only-notice {
          display: flex;
        }
      }
    </style>
    <script type="application/ld+json">
      {
        "@context": "https://siatube-web.com/",
        "@type": "Website",
        "name": "しあTube",
        "url": "https://siatube-web.com/",
        "description": "日本向けのYouTube匿名視聴サイト。広告なし・ログなしでプライバシーを守りながら音楽や動画を再生可能。",
        "inLanguage": "ja",
        "publisher": {
          "@type": "Organization",
          "name": "しあTube"
        }
      }
    </script>
  </head>

  <body>

    <div id="app"></div>

    <main class="desktop-only-notice" aria-labelledby="desktop-only-message">
      <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
        <rect x="7" y="9" width="50" height="35" rx="4" />
        <path d="M24 55h16M32 44v11M7 36h50" />
      </svg>
      <h1 id="desktop-only-message">このサイトはPC向けです。デスクトップ環境でアクセスしてください</h1>
    </main>

    <noscript>
      <h2>JavaScriptが無効です</h2>
      <p>しあTubeを利用するにはJavaScriptを有効にしてください。</p>
    </noscript>

    <script type="module" src="/src/main.js"></script>
    <script data-goatcounter="https://siatube.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
  </body>
</html>
